# config/settings.yaml —— 业务参数的唯一来源（docs/工程规范.md 第 8 条）
# 改参数改这里，不改代码；代码里不写 500 米、30 分钟这类业务数字。
# 一律 UTF-8 保存（Windows 记事本另存为时选 UTF-8）。
version: "2.2.0"          # D11 起用三段式版本号：参数含义变了改第一段，加参数改第二段，改数值改第三段
hotspot:                  # 热点：D04 定的，D06 起从这里读
  name: 西塔
  top_n: 5                # 连接用户数前几的站点参与加权，定热点中心（只在 D04 算中心时用）
  radius_m: 500           # 热点范围：离中心多少米以内算“在西塔”
  lng: 123.41058230374294 # 热点中心（D11 起固定）：用 10-03 的数据按 D04 的方法算一次，写死在这里。
  lat: 41.80694372805909  # 不能每天按当天数据重算——那样每天的“西塔”都不是同一个地方（D11 事故的第二个 bug）
stay:                     # 停留识别（D06）
  radius_m: 500           # 按距离切段的半径：吸收乒乓切换；300–1000 米结果差别不大（D06 敏感性分析）
  min_minutes: 30         # 停留的最短时长：结果对它敏感，必须写进口径
  lookback_hours: 6       # 回看窗口（D12）：处理某天时带上前一天最后几小时的信令，跨午夜的停留才完整
night:                    # 过夜地（D07）
  start_hour: 0           # 夜间时段 0:00–6:00
  end_hour: 6
  min_overlap_minutes: 60    # 与夜间时段至少重叠这么久的停留，才认作过夜地
trip:                     # 出行（D07）
  min_dist_m: 500         # 相邻两个停留相距这么远才算一次出行
visitor:                  # 傍晚访客与客群标签（D08）
  evening_hour: 17        # 傍晚访客：西塔停留在这个时刻之后仍在
  late_hour: 23           # 深夜：这个时刻之后仍在西塔
  near_km: 1.5            # 周边居民：过夜地离热点不到这个距离
  linked_aois:            # 联动商圈：宽表里每个商圈一列“当天去没去过”（列名: 商圈名）
    visit_taiyuan: 太原街商圈
    visit_zhongjie: 中街商圈
gate:                     # 数据质量门禁（D12）：不通过的分区，下游一行都不写
  enforce: true           # false 时只记录、不拦截（排查问题时临时用）
  baseline_days: 7        # 基准 = 最近几个通过门禁的真实分区的中位数
  valid_hour_ratio: 0.2   # 某小时的记录数达到基准小时均值的这个比例，才算“有效小时”
  bootstrap:              # 还没有任何通过门禁的分区时用的基准（10-03 的实测值）
    rows: 518443
    rows_per_user: 91.7
  rules:                  # 每条规则：低于 fail_below（或高于 fail_above）不通过，介于警告线之间是警告
    - {id: G01, name: 数据量相对基准, metric: volume_ratio, fail_below: 0.5, warn_below: 0.8}
    - {id: G02, name: 人均记录数相对基准, metric: rpu_ratio, fail_below: 0.5, warn_below: 0.8}
    - {id: G03, name: 有效小时数, metric: valid_hours, fail_below: 20, warn_below: 24}
    - {id: G04, name: 关键字段缺失率, metric: key_null_rate, fail_above: 0.01, warn_above: 0.001}
    - {id: G05, name: IMSI 格式异常率, metric: imsi_invalid_rate, fail_above: 0.01, warn_above: 0.001}
    - {id: G06, name: 完全重复率, metric: dup_rate, fail_above: 0.05, warn_above: 0.01}
    - {id: G07, name: 基站关联率, metric: cell_match_rate, fail_below: 0.99, warn_below: 0.999}
hourly:                   # 每人每小时一个位置（D09）
  min_cover_minutes: 30   # 停留覆盖这个小时至少这么久，才用停留的位置；否则用信令中位位置
privacy:                  # 对外数据的隐私规则（D09，docs/工程规范.md 第 9 条）
  min_cell_users: 5       # 少于这么多人的格子不对外展示（小样本抑制）
areas:                    # 分析区域（D13）：加一个区域 = 在这里加一项，下游的表、报告、平台自动出现，不改代码
  - name: 西塔
    kind: hotspot         # 圆形：圆心和半径取上面的 hotspot 一段——西塔的坐标只写在一个地方
  - name: 太原街商圈
    kind: polygon         # 多边形：边界取自 ods_aoi_v2（D03 选定的 v2），中心用面积质心
  - name: 中街商圈
    kind: polygon
  - name: 沈阳北站
    kind: polygon
  - name: 沈阳世博园
    kind: polygon
  - name: 棋盘山风景区
    kind: polygon
ads:                      # 应用层（D13）
  focus_area: 西塔        # 平台首页和报告默认看的区域
  radius_bands_km: [1.5, 3, 5, 10, 20]   # 辐射圈层的分界（公里）
  hex:                    # 六边形热力
    origin_area: 西塔     # 网格原点
    size_m: 550           # 六边形边长（米）
    max_km: 18            # 只统计原点周围这么远以内的格子
# 指标口径表 dim_metric 的文字模板（D08，docs/工程规范.md 第 9 条）。
# {a.b} 会被换成上面对应的参数：参数一改，口径表跟着变，永远不会和代码脱节。
metrics:
  - metric: 西塔停留
    meaning: 在西塔停下来待了一段时间
    definition: "停留质心距{hotspot.name}中心 ≤ 半径，且持续 ≥ 最短时长"
    params: "半径 {hotspot.radius_m} 米；最短 {stay.min_minutes} 分钟"
    source_table: dws_stay
  - metric: 傍晚访客
    meaning: 国庆当天傍晚后在西塔待过的人
    definition: "有西塔停留，且该停留结束时刻 ≥ {visitor.evening_hour}:00"
    params: "{visitor.evening_hour}:00"
    source_table: dws_stay
  - metric: 西塔停留时长
    meaning: 在西塔待了多久
    definition: 当天所有西塔停留时长之和；每段按首条到末条信令计
    params: "{visitor.late_hour} 点后仍在者为删失，只是下限"
    source_table: dws_user_day
  - metric: 过夜地
    meaning: 凌晨待得最久的地方（不等于家）
    definition: "与 {night.start_hour}:00–{night.end_hour}:00 重叠最长且重叠 ≥ {night.min_overlap_minutes} 分钟的停留"
    params: "{night.min_overlap_minutes} 分钟"
    source_table: dws_night
  - metric: 客源距离
    meaning: 从多远来
    definition: 过夜地质心到西塔中心的直线距离
    params: 直线距离，不是路程
    source_table: dws_night
  - metric: 客群标签
    meaning: 是哪类人
    definition: "按过夜地：不明 / 市外 / {visitor.near_km} 公里内为周边居民 / 其余为市内来访"
    params: "{visitor.near_km} 公里"
    source_table: dws_user_day
  - metric: 客群标签（修正）
    meaning: 是哪类人，含当天从外地进城的人
    definition: 当天第一条信令在市域外、之后进入市域，或过夜地在市外：外地来客；其余同客群标签
    params: "—"
    source_table: dws_user_day.segment_v2
  - metric: 出行
    meaning: 从一个地方到另一个地方
    definition: "相邻两个停留质心相距 ≥ {trip.min_dist_m} 米"
    params: "{trip.min_dist_m} 米"
    source_table: dws_trip
  - metric: 商圈联动率
    meaning: 西塔访客还去了哪个商圈
    definition: 傍晚访客中，当天在该商圈有停留的人的占比
    params: 商圈边界用 v2
    source_table: dws_user_day
